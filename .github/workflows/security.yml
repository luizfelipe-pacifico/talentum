name: Security

# Varredura de segredos, revisão de dependências e CodeQL
# (docs/SECURITY.md, Supply chain, CI and release integrity).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: o histórico inteiro passa de novo pelo gitleaks e pelo CodeQL.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions fixadas por SHA: uma tag pode ser movida para outro código.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # O relatório nunca vira artefato nem comentário: ele contém o valor encontrado.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
