name: CI

on:
  push:
    branches: [main, feat/conclusao-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./temp/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm web:typecheck
      - run: pnpm web:build
      - run: pnpm cloudflare:build
      - run: pnpm cloudflare:test
