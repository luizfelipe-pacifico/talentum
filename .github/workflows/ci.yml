name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./temp/ci.db
    steps:
      # Actions fixadas por SHA: uma tag pode ser movida para outro código.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm web:typecheck
      - run: pnpm web:build
      # Prova que o pacote da Vercel não alcança desktop, Prisma, SQLite nem o Worker.
      - run: node scripts/web-isolation-check.mjs
      - run: pnpm cloudflare:build
      - run: pnpm cloudflare:test
