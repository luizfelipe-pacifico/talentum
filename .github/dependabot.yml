# Atualizações de dependências (docs/SECURITY.md, Supply chain).
# Toda PR do Dependabot passa pelo CI, pela revisão de dependências e pelo
# gate de segurança antes do merge; nada é mesclado automaticamente.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
